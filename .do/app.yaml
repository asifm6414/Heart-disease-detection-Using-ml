name: cardiolens-demo
region: nyc
services:
  - name: web
    github:
      repo: asifm6414/Heart-disease-detection-Using-ml
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /health/ready
    envs:
      - key: APP_ENV
        value: production
        scope: RUN_AND_BUILD_TIME
      - key: PORT
        value: "8000"
        scope: RUN_TIME
